org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on D:\ while Flutter's pub cache lives on C:\ — Kotlin's
# incremental-compilation "relocatable cache" tries to compute a path
# relative between the two and crashes on Windows (relative paths can't
# cross drive letters: IllegalArgumentException "this and base files have
# different roots"). Disabling incremental compilation avoids that code
# path entirely. Cost: slightly slower Kotlin rebuilds (only affects the
# thin Kotlin wrapper shims Flutter plugins like firebase_core ship, not
# our own Dart code) — worth it over either moving the whole D:\Edusoft
# folder tree to C:\ or relocating PUB_CACHE.
kotlin.incremental=false

